<script>
    // Configuration: Point this to where your Python bot's web server is hosting/listening
    const BACKEND_API_URL = "http://YOUR_BOT_SERVER_IP:5000/api/verify";
    // Replace this with your actual Discord OAuth2 Link (WITHOUT the 'bot' or 'permissions' scopes)
    const OAUTH_LINK = "https://discord.com/oauth2/authorize?client_id=1505350098551570492&response_type=code&redirect_uri=https%3A%2F%2Findex-html-blue-psi-63.vercel.app%2F&scope=identify";

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active-page'));
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));

        const targetPage = document.getElementById('page-' + pageId);
        if (targetPage) targetPage.classList.add('active-page');
        
        const targetNav = document.getElementById('nav-' + pageId);
        if (targetNav) targetNav.classList.add('active');
    }

    function startVerification() {
        // Redirect the user directly to Discord's official secure login portal
        window.location.href = OAUTH_LINK;
    }

    // Automatically execute when the webpage loads
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        // If the URL contains '?code=...', it means the user just logged in via Discord
        if (code) {
            switchPage('loading');

            // Send the code securely to your Python background bot
            fetch(BACKEND_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ code: code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    switchPage('success');
                } else {
                    alert("Verification Failed: " + data.error);
                    switchPage('home');
                }
            })
            .catch(error => {
                console.error("Error connecting to backend:", error);
                alert("Could not connect to the verification backend server.");
                switchPage('home');
            });
        }
    });
</script>
